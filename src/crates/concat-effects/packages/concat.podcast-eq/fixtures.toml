chain = "highpass=f=80,equalizer=f=300:t=q:w=1.2:g=-2.5,equalizer=f=120:t=q:w=1.0:g=2.0,equalizer=f=3500:t=q:w=1.0:g=4.0,treble=g=2.4:f=8000:w=0.8,alimiter=limit=0.95"

